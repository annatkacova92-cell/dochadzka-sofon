<!doctype html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dochádzka Sofon — nové heslo</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="center-wrap">
    <div class="card auth-card">
      <h1>Nové heslo</h1>
      <p class="subtitle">Zadaj nové heslo k svojmu účtu.</p>

      <form id="resetForm">
        <div class="field">
          <label for="newPassword">Nové heslo</label>
          <input id="newPassword" type="password" required minlength="6" placeholder="min. 6 znakov" />
        </div>
        <div class="field">
          <label for="confirmPassword">Zopakuj nové heslo</label>
          <input id="confirmPassword" type="password" required minlength="6" placeholder="min. 6 znakov" />
        </div>
        <button class="btn full" id="submitBtn" type="submit">Nastaviť nové heslo</button>
        <div class="error-msg" id="errorMsg"></div>
        <div class="status-line" id="statusMsg"></div>
        <div class="status-line"><a href="index.html">Späť na prihlásenie</a></div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
